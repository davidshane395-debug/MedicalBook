{% extends 'admin/base.html' %}{% block title %}Website content{% endblock %}{% block heading %}Website content{% endblock %}{% block content %}<div class="admin-title"><div><h1>Website content</h1><p>Update public business, discount and contact information.</p></div></div><form class="form-card settings-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Store name<input name="store_name" value="{{ values.get('store_name', '') }}"></label><label>Tagline<input name="tagline" value="{{ values.get('tagline', '') }}"></label><label class="discount-input">Store-wide discount (%)<input type="number" name="discount_percent" min="0" max="100" step="1" value="{{ values.get('discount_percent', '0') }}"><small>Enter 10 for 10% off every book. Enter 0 to turn it off.</small></label><label>WhatsApp number<input name="whatsapp" value="{{ values.get('whatsapp', '') }}" placeholder="923001234567"><small>Country code + number, without spaces.</small></label><label>Phone display<input name="phone" value="{{ values.get('phone', '') }}"></label><label class="span-2">Address / delivery note<input name="address" value="{{ values.get('address', '') }}"></label><label class="span-2">Facebook URL<input type="url" name="facebook_url" value="{{ values.get('facebook_url', '') }}"></label></div><button class="admin-btn">Save changes</button></form>{% endblock %}
